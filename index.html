<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#000000"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black"><meta name="apple-mobile-web-app-title" content="Askesis"><link rel="apple-touch-icon" href="icon-180.png"><link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png"><link rel="manifest" href="manifest.webmanifest"><style>:root{color-scheme:dark;padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif;background:#000}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>Askesis</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* v2 · phone-first single column (max 560px), true-black flat. One question per screen.
   Lime only means "done / progress / ready to go up". The one primary action is a white pill. */
:root {
  color-scheme: dark;
  --ground: #000000; --surface: #111111; --surface-2: #1a1a1a; --raised: #2a2a2a; --border: #1a1a1a; --rule: #1f1f1f; --control: #6b6b6b;
  --text: #ffffff; --muted: #b4b4b4; --faint: #949494;
  --accent: #c6f24e; --accent-ink: #000000; --accent-soft: #222a10;
  --warn: #ffb340; --warn-bg: #2b2414; --warn-ink: var(--warn);
  --radius-card: 20px; --radius-inner: 12px;
  --gap: 12px; --pad: 18px; --tap: 44px;
  --font: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --fs-hero: 44px; --fs-title: 24px; --fs-section: 17px; --fs-body: 15px; --fs-small: 13px;
}
* { box-sizing: border-box; }
html, body { background: var(--ground); color: var(--text); }
body { font-family: var(--font); font-size: var(--fs-body); line-height: 21px; -webkit-font-smoothing: antialiased; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
.wrap { max-width: 560px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 calc(110px + env(safe-area-inset-bottom, 0px)); }
body::before { content: ""; position: fixed; left: 0; right: 0; top: 0; height: env(safe-area-inset-top, 0px); background: var(--ground); z-index: 6; } /* statusbar-cover */
.top { position: sticky; top: 0; z-index: 5; background: var(--ground); display: flex; align-items: center; justify-content: space-between; gap: 12px; box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); height: calc(52px + env(safe-area-inset-top, 0px)); }
.top .mark { font-weight: 600; white-space: nowrap; }
.top .sync { font-size: var(--fs-small); color: var(--faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.back { height: var(--tap); padding: 0 4px; border: 0; background: transparent; color: var(--muted); display: inline-flex; align-items: center; gap: 4px; }
h1 { font-size: var(--fs-title); line-height: 30px; font-weight: 600; margin: 8px 0 0; letter-spacing: -0.015em; text-wrap: balance; }
h2 { font-size: var(--fs-section); line-height: 22px; font-weight: 600; margin: 0; }
p { margin: 0; }
.muted { color: var(--muted); } .faint { color: var(--faint); } .small { font-size: var(--fs-small); line-height: 18px; }
.stack { display: flex; flex-direction: column; gap: var(--gap); }
.block { margin-top: 24px; display: flex; flex-direction: column; gap: 10px; }
.block-h { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.card { background: var(--surface); border-radius: var(--radius-card); padding: var(--pad); display: flex; flex-direction: column; gap: 12px; }
.primary { height: 52px; padding: 0 22px; border-radius: 999px; border: 0; background: var(--text); color: #000; font-weight: 600; font-size: 16px; width: 100%; }
.primary:active { transform: scale(.985); }
.primary[disabled] { background: var(--raised); color: var(--faint); }
.ghost { min-height: 40px; padding: 8px 16px; border-radius: 999px; border: 1px solid var(--control); background: transparent; color: var(--text); font-size: 14px; }
.ghost:active { background: var(--raised); }
.ghost[disabled] { opacity: .45; }
.link { border: 0; background: transparent; color: var(--muted); padding: 10px 0; text-decoration: underline; text-underline-offset: 3px; text-align: left; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chips .ghost { text-align: left; }
.icon-btn { width: var(--tap); height: var(--tap); border-radius: 999px; border: 0; background: var(--raised); display: grid; place-items: center; flex: none; }
.icon-btn svg { width: 20px; height: 20px; stroke: var(--text); fill: none; stroke-width: 2; stroke-linecap: round; }
.alert { background: var(--warn-bg); color: var(--warn-ink); border-radius: 14px; padding: 12px 14px; }
.seg { display: flex; gap: 6px; }
.seg button { flex: 1; height: 40px; border-radius: 999px; border: 1px solid var(--control); background: transparent; color: var(--muted); font-weight: 500; }
.seg button[aria-pressed="true"] { background: var(--raised); border-color: var(--raised); color: var(--text); }
.seg.scroll { overflow-x: auto; }
.seg.scroll button { flex: 1 0 46px; }

/* coach card */
.coach-line { font-size: 19px; line-height: 27px; font-weight: 500; letter-spacing: -0.005em; }
.coach-line b { color: var(--accent); font-weight: 500; }

/* today's session card */
.sess-meta { display: flex; gap: 16px; color: var(--muted); }
.done-line { display: flex; align-items: center; gap: 10px; color: var(--accent); font-weight: 500; }

/* checks */
.check { width: var(--tap); height: var(--tap); border-radius: 999px; border: 1.5px solid var(--control); background: transparent; display: grid; place-items: center; flex: none; }
.check svg { width: 20px; height: 20px; stroke: transparent; fill: none; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
.check[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); }
.check[aria-pressed="true"] svg { stroke: var(--accent-ink); }

/* meals */
.dots { display: flex; gap: 4px; }
.dots i { width: 18px; height: 6px; border-radius: 3px; background: var(--raised); }
.dots i.on { background: var(--accent); }
.meals { background: var(--surface); border-radius: var(--radius-card); padding: 4px var(--pad); }
.meal { display: grid; grid-template-columns: var(--tap) 1fr; gap: 12px; padding: 10px 0; border-top: 1px solid var(--rule); }
.meal:first-child { border-top: 0; }
.meal details { min-width: 0; }
.meal summary { list-style: none; cursor: pointer; display: flex; justify-content: space-between; gap: 10px; align-items: center; min-height: var(--tap); }
.meal summary::-webkit-details-marker { display: none; }
.meal summary .chev { flex: none; color: var(--faint); transition: transform .2s; }
.meal details[open] summary .chev { transform: rotate(180deg); }
.meal .mt { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.meal details[open] .mt { -webkit-line-clamp: unset; }
.meal .ml { display: block; font-size: var(--fs-small); color: var(--faint); line-height: 16px; }
.meal.on .mt { color: var(--muted); }
.meal ul { margin: 4px 0 6px; padding-left: 18px; color: var(--muted); display: flex; flex-direction: column; gap: 4px; }

/* habits */
.habits { background: var(--surface); border-radius: var(--radius-card); padding: 4px var(--pad); }
.hrow { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 64px; border-top: 1px solid var(--rule); }
.hrow:first-child { border-top: 0; }
.hrow > div:first-child { min-width: 0; }
.hctl { display: flex; gap: 8px; align-items: center; flex: none; }
.pill-t { min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1.5px solid var(--control); background: transparent; color: var(--text); font-size: 14px; display: inline-flex; align-items: center; gap: 6px; }
.pill-t[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.wbar { height: 6px; border-radius: 3px; background: var(--raised); margin-top: 6px; overflow: hidden; width: 140px; max-width: 100%; }
.wbar i { display: block; height: 100%; background: var(--accent); }

/* session */
.sess-top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-top: 4px; }
.track { height: 6px; border-radius: 3px; background: var(--raised); overflow: hidden; margin-top: 10px; }
.track i { display: block; height: 100%; background: var(--accent); border-radius: 3px; transition: width .25s ease; }
.xlist { display: flex; flex-direction: column; gap: 8px; margin-top: 16px; }
.xrow { width: 100%; min-height: 56px; display: grid; grid-template-columns: 28px 1fr auto; align-items: center; gap: 10px; text-align: left; border: 0; border-radius: 16px; background: var(--surface); padding: 8px 14px; }
.xrow .st { width: 22px; height: 22px; border-radius: 999px; border: 1.5px solid var(--control); display: grid; place-items: center; }
.xrow .st.full { background: var(--accent); border-color: var(--accent); }
.xrow .st.full svg { stroke: var(--accent-ink); }
.xrow .st.part { border-color: var(--accent); }
.xrow .st svg { width: 14px; height: 14px; fill: none; stroke: transparent; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
.xrow .nm { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.xrow.done .nm { color: var(--muted); }
.xrow .rt { color: var(--faint); font-size: var(--fs-small); white-space: nowrap; }
.active { background: var(--surface-2); border-radius: 22px; padding: var(--pad); display: flex; flex-direction: column; gap: 14px; }
.a-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.a-head > div { min-width: 0; }
.a-name { font-size: 20px; line-height: 26px; font-weight: 600; }
.up { color: var(--accent); }
.setlab { color: var(--muted); }
.hero { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.hero .box { background: var(--surface); border-radius: 16px; padding: 12px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.hero .lab { font-size: var(--fs-small); color: var(--faint); }
.hero input { width: 100%; min-width: 0; border: 0; background: transparent; font-size: var(--fs-hero); line-height: 50px; font-weight: 600; letter-spacing: -0.02em; padding: 0; font-variant-numeric: tabular-nums; -moz-appearance: textfield; }
.hero input::-webkit-outer-spin-button, .hero input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.hero .big { font-size: var(--fs-hero); line-height: 50px; font-weight: 600; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.hero .pm { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.hero .pm button { height: var(--tap); border-radius: var(--radius-inner); border: 0; background: var(--raised); font-size: 22px; line-height: 1; }
.hero .pm button:active { background: var(--control); }
.hero .pm button { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; touch-action: manipulation; }
.hero .bw { font-size: 22px; line-height: 50px; font-weight: 600; color: var(--muted); }
.reps { display: flex; gap: 6px; overflow-x: auto; scroll-snap-type: x proximity; padding-bottom: 2px; scrollbar-width: none; }
.reps::-webkit-scrollbar { display: none; }
.reps button { flex: none; min-width: 46px; height: 46px; border-radius: 999px; border: 1.5px solid var(--raised); background: transparent; color: var(--faint); font-size: 16px; font-weight: 500; scroll-snap-align: center; font-variant-numeric: tabular-nums; }
.reps button.in { border-color: var(--control); color: var(--text); }
.reps button[aria-pressed="true"] { background: var(--text); border-color: var(--text); color: #000; font-weight: 600; }
.sets { display: flex; gap: 6px; flex-wrap: wrap; }
.sets button { min-height: 40px; padding: 0 12px; border-radius: 999px; border: 1.5px solid var(--raised); background: transparent; color: var(--muted); font-size: 14px; display: inline-flex; gap: 6px; align-items: center; font-variant-numeric: tabular-nums; }
.sets button.d { color: var(--text); border-color: var(--accent-soft); background: var(--accent-soft); }
.sets button.d b { color: var(--accent); font-weight: 600; }
.sets button[aria-current="true"] { border-color: var(--text); color: var(--text); }
.sets button[data-k] { border-style: dashed; } /* riscaldamento e calo: serie di contorno */
.row2 { display: flex; gap: 8px; }
.row2 .ghost { flex: 1; }

/* session bar (replaces the tab bar during a session) */
.setx { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 8px; } .setx button { min-height: 48px; border: 0; border-radius: 999px; background: transparent; box-shadow: inset 0 0 0 2px var(--raised); color: var(--text); font-weight: 600; font-size: 15px; }
.sbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 7; background: var(--surface); padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); box-shadow: 0 -10px 30px rgba(0,0,0,.6); }
.sbar > div { max-width: 528px; margin: 0 auto; display: flex; align-items: center; gap: 10px; }
.sbar .clock { display: flex; flex-direction: column; min-width: 64px; }
.sbar .clock b { font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums; }
.sbar .rest { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; background: var(--raised); border-radius: 14px; padding: 6px 6px 6px 12px; }
.sbar .rest .t { font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; }
.sbar .rest .g { flex: 1; min-width: 0; }
.sbar .rest .g .track { margin-top: 4px; background: #3a3a3a; }
.sbar .rest button { height: 44px; min-width: 44px; padding: 0 10px; border-radius: 999px; border: 0; background: var(--control); font-size: 13px; flex: none; }
.sbar .spacer { flex: 1; }
.sbar .fine { height: 48px; padding: 0 18px; border-radius: 999px; border: 0; background: var(--text); color: #000; font-weight: 600; flex: none; }

/* tab bar */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 7; background: var(--ground); border-top: 1px solid var(--border); padding: 0 max(8px, env(safe-area-inset-right, 0px)) env(safe-area-inset-bottom, 0px) max(8px, env(safe-area-inset-left, 0px)); }
.tabs > div { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); }
.tabs button { height: 62px; border: 0; background: transparent; color: var(--faint); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 12px; position: relative; }
.tabs button svg { width: 23px; height: 23px; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.tabs button[aria-current="page"] { color: var(--text); font-weight: 600; }
.tabs .live { position: absolute; top: 10px; left: calc(50% + 10px); width: 8px; height: 8px; border-radius: 4px; background: var(--accent); }

/* lists, charts, progress */
.list { background: var(--surface); border-radius: var(--radius-card); padding: 4px var(--pad); }
.lrow { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; padding: 12px 0; border-top: 1px solid var(--rule); }
.lrow:first-child { border-top: 0; }
.lrow > :first-child { min-width: 0; }
.lrow .r { text-align: right; flex: none; font-variant-numeric: tabular-nums; }
.prow { width: 100%; text-align: left; background: transparent; border: 0; padding: 12px 0; border-top: 1px solid var(--rule); display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
.prow:first-child { border-top: 0; }
.prow .r { text-align: right; flex: none; font-variant-numeric: tabular-nums; }
.delta { color: var(--accent); }
.chart svg { width: 100%; height: auto; display: block; }
.kv { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--rule); border-radius: 16px; overflow: hidden; }
.kv > div { background: var(--surface); padding: 14px; }
.kv .k { color: var(--faint); font-size: var(--fs-small); }
.kv .v { font-size: 20px; font-weight: 500; margin-top: 2px; font-variant-numeric: tabular-nums; }
.kv4 { grid-template-columns: repeat(4, 1fr); } .kv4 .v { font-size: 16px; }
.empty { background: var(--surface); border-radius: var(--radius-card); padding: 26px var(--pad); display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.week > div { background: var(--surface); border-radius: 12px; padding: 10px 0; text-align: center; display: flex; flex-direction: column; gap: 6px; }
.week .dn { color: var(--faint); font-size: 12px; }
.week .w { font-size: 18px; font-weight: 600; height: 22px; }
.week .w.rest { color: var(--faint); font-weight: 400; font-size: 14px; }
.week .stt { height: 6px; width: 6px; border-radius: 3px; margin: 0 auto; }
.week .stt.ok { background: var(--accent); }
.week > div.today { background: var(--raised); }
.bars { display: flex; flex-direction: column; gap: 10px; }
.bar { display: grid; grid-template-columns: 118px 1fr 30px; gap: 10px; align-items: center; }
.bar .lab { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 14px; }
.bar .tr { position: relative; height: 10px; background: var(--raised); border-radius: 5px; }
.bar .tr i { position: absolute; inset: 0 auto 0 0; background: var(--accent); border-radius: 5px; }
.bar .tr .band { position: absolute; top: -4px; bottom: -4px; border-left: 1px dashed var(--control); border-right: 1px dashed var(--control); }
.bar .v { text-align: right; font-variant-numeric: tabular-nums; }
ul.plain { margin: 0; padding: 0 0 0 18px; display: flex; flex-direction: column; gap: 6px; }
.daylist { margin: 0; padding: 0; list-style: none; }
.daylist li { display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; border-top: 1px solid var(--rule); }
.daylist li:first-child { border-top: 0; }
.daylist li span:last-child { color: var(--muted); flex: none; font-variant-numeric: tabular-nums; }

/* photos */
.ph-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.ph { position: relative; aspect-ratio: 3/4; border-radius: 12px; overflow: hidden; background: var(--raised); border: 0; padding: 0; max-width: 100%; }
.ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
.ph .cap { position: absolute; left: 0; right: 0; bottom: 0; padding: 18px 8px 6px; background: rgba(0,0,0,.6); font-size: 11px; line-height: 14px; text-align: left; }
.ph[aria-pressed="true"] { outline: 3px solid var(--text); outline-offset: -3px; }
.ph .sel { position: absolute; top: 6px; left: 6px; height: 22px; min-width: 22px; padding: 0 6px; border-radius: 11px; background: var(--text); color: #000; font-size: 12px; font-weight: 600; display: grid; place-items: center; }
.cmp { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.cmp figure { margin: 0; }
.cmp img { width: 100%; aspect-ratio: 3/4; object-fit: cover; border-radius: 12px; display: block; }
.cmp figcaption { color: var(--muted); font-size: var(--fs-small); margin-top: 4px; }
.levels { display: grid; grid-template-columns: repeat(6, 1fr); gap: 3px; }
.levels span { height: 30px; border-radius: 6px; background: var(--raised); display: grid; place-items: center; font-size: 12px; color: var(--faint); }
.levels span.on { background: var(--accent); color: #000; font-weight: 600; }
.file-btn { position: relative; overflow: hidden; }
.file-btn input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.posesel { display: flex; gap: 6px; }

/* sheets */
.scrim { position: fixed; inset: 0; background: rgba(0,0,0,.72); z-index: 20; display: flex; align-items: flex-end; justify-content: center; }
.sheet { width: 100%; max-width: 560px; max-height: 90vh; max-height: 90dvh; overflow-y: auto; background: var(--surface); border-radius: 24px 24px 0 0; padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 16px; box-shadow: 0 -12px 40px rgba(0,0,0,.6); }
.sheet.full { height: 92vh; height: 92dvh; }
.grab { width: 40px; height: 4px; border-radius: 2px; background: var(--raised); margin: 0 auto 4px; flex: none; }
.alt { background: var(--raised); border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 6px; }
.lvl { display: inline-flex; gap: 3px; vertical-align: middle; }
.lvl i { width: 10px; height: 4px; border-radius: 2px; background: var(--control); }
.lvl i.on { background: var(--text); }
.alt .acts { display: flex; gap: 8px; margin-top: 6px; }
.alt .acts button { flex: 1; height: 40px; border-radius: 999px; border: 1px solid var(--control); background: transparent; }
.alt .acts button.fill { background: var(--text); color: #000; border-color: var(--text); font-weight: 600; }
.menu-btn { width: 100%; min-height: 52px; text-align: left; border: 0; border-radius: 14px; background: var(--raised); padding: 0 16px; font-size: 16px; }
.stepper { display: grid; grid-template-columns: 56px 1fr 56px; align-items: center; height: 60px; background: var(--raised); border-radius: 16px; }
.stepper button { height: 100%; border: 0; background: transparent; font-size: 24px; color: var(--muted); }
.stepper input { width: 100%; min-width: 0; text-align: center; border: 0; background: transparent; font-size: 28px; font-weight: 600; font-variant-numeric: tabular-nums; -moz-appearance: textfield; }
.stepper input::-webkit-outer-spin-button, .stepper input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.fat { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.fat button { height: 44px; border-radius: 12px; border: 0; background: var(--raised); color: var(--muted); font-variant-numeric: tabular-nums; }

.toast { position: fixed; left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); top: calc(12px + env(safe-area-inset-top, 0px)); z-index: 60; max-width: 528px; margin: 0 auto; min-height: 60px; box-sizing: border-box; display: flex; align-items: center; gap: 12px; padding: 10px 10px 10px 16px; border-radius: 20px; background: rgba(22,22,22,.88); -webkit-backdrop-filter: blur(16px) saturate(120%); backdrop-filter: blur(16px) saturate(120%); color: var(--text); box-shadow: 0 0 0 1px color-mix(in srgb, var(--accent) 45%, transparent), 0 12px 32px rgba(0,0,0,.6); animation: ok-in .35s cubic-bezier(.2,1,.3,1) both; }
@keyframes ok-in { from { opacity: 0; transform: translateY(-12px) scale(.96); } }

/* energy */

/* hello */
.hello { position: fixed; inset: 0; z-index: 50; background: #000; display: flex; align-items: center; justify-content: center; overflow: hidden; cursor: pointer; transition: transform .55s cubic-bezier(.7,0,.3,1); }

.hello .logo * { transform-box: fill-box; }

.hello .lg-bar { transform-origin: 50% 50%; transform: scaleX(0); animation: bar .3s cubic-bezier(.7,0,.2,1) .5s forwards; }

.hello .who { font-size: 22px; font-weight: 600; color: var(--accent); opacity: 0; transform: translateY(12px); animation: slide .4s cubic-bezier(.2,1,.3,1) 1.4s forwards; }

@keyframes rise { to { transform: none; } }
@keyframes bar { to { transform: scaleX(1); } }
@keyframes clamp { 0% { opacity: 0; transform: translateX(var(--dx)); } 100% { opacity: 1; transform: none; } }
@keyframes slide { to { opacity: 1; transform: none; } }
@keyframes shake { 0%, 100% { transform: none; } 25% { transform: translateY(5px); } 55% { transform: translateY(-2px); } 80% { transform: translateY(1px); } }
.greet-date { color: var(--muted); margin-top: 2px; }

  for (const it of L) { const i = d.sets[it.id].findIndex(s => !s.done); if (i >= 0) return { id: it.id, i }; }
  const it = L[L.length - 1]; return { id: it.id, i: 0 };
}
function saveDrafts() { lsSet("drafts", S.drafts); }
function persistFoods() { S.foods.forEach(f => delete f.pending); lsSet("foods", S.foods); if (S.db) S.db.doc(S.base + "/foods").set({ kind: "foods", items: JSON.parse(JSON.stringify(S.foods)) }).catch(() => { S.foods.forEach(f => f.pending = true); syncMsg("Alimenti salvati solo su questo dispositivo"); }); }
async function persistState() {
  lsSet("state", S.state);
  if (S.db) try { await S.db.doc(S.base + "/state").set(JSON.parse(JSON.stringify(S.state))); } catch (e) { syncMsg("Salvataggio online non riuscito: dati tenuti su questo dispositivo"); }
}
async function persistSession(sess) {
  S.sessions.push(sess); lsSet("sessions", S.sessions);
  if (S.db) try { await S.db.doc(S.base + "/" + sess.id).set({ kind: "session", ...sess }); } catch (e) { syncMsg("Seduta salvata solo sul telefono, non online"); }
}
function weekDone() {
  const mon = mondayOf(new Date()), sun = new Date(mon); sun.setDate(mon.getDate() + 7); const map = {};
  for (const s of S.sessions) { const t = new Date(s.date); if (t >= mon && t < sun) map[(t.getDay() + 6) % 7] = s.day; }
  return map;
}

  let s1;
  if (fa) s1 = `Fatica alta nelle ultime sedute: <b>questa settimana fai metà delle serie</b>, con gli stessi carichi.`;
  else if (dt0) s1 = `<b>Seduta ${dt0.day} fatta.</b> Prossima: seduta ${nextDay()}.`;
  else if (a) s1 = `Hai una <b>seduta ${a} in corso</b>: riprendila da dove eri rimasto.`;
  else if (!nd) s1 = `Carica la tua scheda di allenamento dalle impostazioni per avere le sedute qui.`;
  else { const ups = P[nd].items.filter(it => plan(it).up).length;
    s1 = `Prossima seduta: <b>${nd}</b>.` + (ups ? ` ${ups === 1 ? "Un esercizio è pronto" : ups + " esercizi sono pronti"} a salire di carico.` : " Punta a una ripetizione in più per serie."); }
  const mo = meal && mealOf(dw, meal[0]), left = PLAN.kcal - intake(localISO()).eaten.kcal;
  const s2 = !hasMealPlan() ? (left > 0 ? ` Per oggi restano circa ${r10(left)} kcal.` : " Obiettivo di calorie raggiunto per oggi.") : mo ? ` Prossimo pasto: ${meal[1].toLowerCase()} (${mo.t.charAt(0).toLowerCase() + mo.t.slice(1)}).` : meal ? "" : " Tutti i pasti di oggi sono segnati.";

const AT = { col: "a colazione", spu: "allo spuntino", pra: "a pranzo", mer: "a merenda", cen: "a cena", extra: "come spuntino in più" };
const r10 = n => fmt(Math.round(n / 10) * 10);

      ${r.covered < it.gap - 150 ? `<p class="small muted">Gli altri ${r10(it.gap - r.covered)} kcal distribuiscili sui prossimi 2–3 giorni: conta la media della settimana, non il singolo giorno.</p>` : ""}

      <div class="tile"><span class="ic"><svg viewBox="0 0 24 24"><path d="M6.5 6.5v11M17.5 6.5v11M3.5 9.5v5M20.5 9.5v5M6.5 12h11"/></svg></span><span class="tv">${Math.round(e.p)}<span class="tl"> / ${PLAN.pro} g</span></span><span class="tl">Proteine</span><span class="tb"><i style="width:${Math.min(100, e.p / PLAN.pro * 100)}%"></i></span></div>

    ${it.restKeys.length && hasMealPlan() ? `<div class="small faint">In grigio i pasti del piano che restano: a fine giornata arrivi a ${r10(it.projected)} kcal.</div>` : ""}

(async function connect() {
  if (!window.claude || !window.claude.use) { await setupSite(); render(); return; }
  const use = n => window.claude.use(n).catch(() => null);
  const [db, user, assets, sample, downloads] = await Promise.all([use("db"), use("user"), use("assets"), use("sample"), use("downloads")]);
  S.assets = assets; S.sample = sample; S.downloads = downloads;
  if (db && user) {
    try {
      const uid = await user.id(); S.db = db; S.base = "data/users/" + uid; syncMsg("Sincronizzato con il tuo account");
      db.collection(S.base).onSnapshot(snap => {
        let state = null, chat = null; const sessions = [], photos = [], days = {};
        for (const doc of snap.docs) { const x = doc.data() || {};
          if (doc.id === "state") state = x; else if (doc.id === "chat") chat = x; else if (x.kind === "session") sessions.push(x); else if (x.kind === "photo") photos.push(x);
          else if (x.kind === "day" && x.date) days[x.date] = { meals: x.meals || {}, water: x.water || 0, sup: x.sup || {}, peso: x.peso ?? null, custom: x.custom || {}, skip: x.skip || {}, extra: x.extra || [] }; }
        S.docIds = snap.docs.map(x => x.id);
        const strip = x => { const o2 = { ...x }; delete o2.kind; return o2; };
        for (const nm of ["profile", "training", "diet"]) { const dd = snap.docs.find(x => x.id === nm); if (dd) { if (!S.ob) { S[nm] = strip(dd.data()); lsSet(nm, S[nm]); } } else if (S[nm]) persistDoc(nm, S[nm]); }
        applyAll();
        if (chat && !S.coachBusy) { S.chat = { msgs: chat.msgs || [] }; lsSet("chat", S.chat); }
        const fd = snap.docs.find(x => x.id === "foods"); if (fd) { const loc = S.foods.filter(f => !(fd.data().items || []).some(y => y.id === f.id) && f.pending); S.foods = (fd.data().items || []).concat(loc); lsSet("foods", S.foods); if (loc.length) persistFoods(); } else if (S.foods.length) persistFoods();
        for (const [d, x] of Object.entries(S.days)) if (!days[d]) { days[d] = x; saveDay(d); }
        S.days = Object.assign(days, Object.fromEntries(Object.entries(S.days).filter(([d]) => dayTimers[d]))); lsSet("days", S.days);
        if (state) { S.state = { ex: state.ex || {}, subs: state.subs || {}, creatinaG: state.creatinaG }; lsSet("state", S.state); }
        else if (Object.keys(S.state.ex).length || Object.keys(S.state.subs).length) persistState();
        const ids = new Set(sessions.map(s => s.id));
        for (const s of S.sessions) if (!ids.has(s.id)) { sessions.push(s); db.doc(S.base + "/" + s.id).set({ kind: "session", ...s }).catch(() => {}); }
        S.sessions = sessions; lsSet("sessions", S.sessions); S.photos = photos;
        if (!S.sheet && !document.activeElement?.matches?.("input,textarea")) render();
      }, () => syncMsg("Dati tenuti su questo dispositivo"));
    } catch (e) { syncMsg("Dati tenuti su questo dispositivo"); }
  }
  render();
})();
